# CMS (Construction Management System) - full deployment: MySQL + the app (API + web UI).
# Configure via a .env file next to this compose file (see .env.example).
#   docker compose up -d --build
# The app comes up on http://<host>:${APP_PORT:-4311}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bridge
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # A scoped account for the app, created on FIRST boot of a fresh volume.
      # Point the app at it with DB_USER/DB_USER_PASSWORD so a SQL-injection or
      # Prisma bug cannot reach beyond the bridge database. Existing
      # deployments: the user is not created retroactively - see DEPLOY.md.
      MYSQL_USER: ${DB_USER:-bridge}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-changeme-scoped-db-password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4311}:4311"
    environment:
      # Defaults to root so existing deployments keep working on upgrade. New
      # installs should set DB_USER/DB_USER_PASSWORD in .env to use the scoped
      # account instead.
      DATABASE_URL: mysql://${DB_APP_USER:-root}:${DB_APP_PASSWORD:-${DB_PASSWORD}}@db:3306/bridge
      # Must be >= 32 chars; the API refuses to start otherwise.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:4311}
      # Browser origins allowed to call the API (defaults to APP_URL).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Set to 1 behind a reverse proxy so rate limiting sees the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Email (optional - empty means dev mode: emails log to the container console)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      # MoMo account subscribers pay into (shown at checkout)
      MOMO_NUMBER: ${MOMO_NUMBER:-}
      MOMO_NAME: ${MOMO_NAME:-}
      # Platform Super Admin (no default password - the seed refuses a weak one)
      SUPER_EMAIL: ${SUPER_EMAIL:-}
      SUPER_PASSWORD: ${SUPER_PASSWORD:-}
      # Demo dataset - development only; its logins share one known password
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - uploads:/app/api/uploads
    depends_on:
      db:
        condition: service_healthy

  # Nightly database dump + uploads snapshot into ./backups on the host.
  # Without this the only copy of every daily report, wage record and site
  # photo lives on one disk.
  backup:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_PWD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
    volumes:
      - ./docker-backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
